<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>도서 추천 시스템 — 신경망 임베딩 + 세렌디피티(MMR)</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666;
    --card-bg: #f4f4f6; --accent: #4f46e5; --border: #e2e2e6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #f0f0f0; --muted: #a0a0a8;
      --card-bg: #1e1e22; --accent: #8b87f7; --border: #333338; }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    margin: 0; padding: 24px 16px 48px; max-width: 720px; margin-inline: auto; line-height: 1.6;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; font-size: 0.9rem; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
  input[type="text"] {
    width: 100%; font-size: 1rem; padding: 10px 12px; margin-top: 6px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--fg);
  }
  input:disabled { opacity: 0.5; }
  .lambda-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  input[type="range"] { flex: 1; }
  button {
    margin-top: 16px; padding: 10px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-top: 16px; overflow-x: auto;
  }
  .card h3 { margin: 0 0 8px 0; font-size: 1rem; }
  .metrics { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
  ol.book-list { list-style: none; padding-left: 0; margin: 0; }
  ol.book-list > li { margin-top: 6px; }
  ol.book-list details summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px;
    font-weight: 500; padding: 4px 0;
  }
  ol.book-list details summary::-webkit-details-marker { display: none; }
  ol.book-list details summary::before {
    content: "▸"; display: inline-block; color: var(--accent);
    transition: transform 0.15s ease; font-size: 0.8em;
  }
  ol.book-list details[open] summary::before { transform: rotate(90deg); }
  ol.book-list .description {
    color: var(--muted); font-size: 0.85rem; margin: 2px 0 8px 18px; line-height: 1.5;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
  th, td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  #status { font-size: 0.85rem; color: var(--muted); margin-top: 10px; }
  .spinner {
    display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h1>📚 도서 추천 시스템 — 신경망 임베딩 + 세렌디피티(MMR)</h1>
  <p class="sub">TF-IDF 버전과 달리, 철자가 달라도 의미가 비슷하면 찾아내는 신경망 임베딩(Transformers.js)을 사용합니다. "사랑"으로 검색해도 "재회", "이별" 같은 로맨스 책이 매칭됩니다.</p>

  <div id="status"><span class="spinner"></span>임베딩 모델을 불러오는 중입니다 (최초 1회, 약 50MB)...</div>

  <label for="keyword">검색 키워드</label>
  <input type="text" id="keyword" placeholder="예: 사랑, 우주 미래 과학" value="사랑" disabled />

  <label for="lambda">λ (1.0 = 관련성 중심, 낮을수록 세렌디피티 ↑)</label>
  <div class="lambda-row">
    <input type="range" id="lambda" min="0" max="1" step="0.1" value="0.7" disabled />
    <span id="lambda-value">0.7</span>
  </div>

  <button id="run" disabled>추천 받기</button>

  <div id="result"></div>

  <div class="card">
    <h3>λ값별 비교 (현재 키워드 기준)</h3>
    <table id="compare-table">
      <thead><tr><th>λ</th><th>평균 관련성</th><th>다양성 지수</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script type="module">
  import { BOOKS } from "./data.js";
  import { BookRecommender } from "./recommender.js";

  const statusEl = document.getElementById("status");
  const keywordInput = document.getElementById("keyword");
  const lambdaInput = document.getElementById("lambda");
  const lambdaValueLabel = document.getElementById("lambda-value");
  const runButton = document.getElementById("run");
  const resultDiv = document.getElementById("result");

  let rec = null;

  lambdaInput.addEventListener("input", () => {
    lambdaValueLabel.textContent = Number(lambdaInput.value).toFixed(1);
  });

  async function init() {
    try {
      rec = await BookRecommender.create(BOOKS, (progress) => {
        // progress는 모델 다운로드 진행 상황 객체 (파일별 로딩률)
        if (progress && progress.status === "progress" && typeof progress.progress === "number") {
          statusEl.innerHTML = `<span class="spinner"></span>모델 다운로드 중... ${Math.round(progress.progress)}%`;
        }
      });
      statusEl.textContent = "준비 완료! 키워드를 입력하고 추천 받기를 눌러보세요.";
      keywordInput.disabled = false;
      lambdaInput.disabled = false;
      runButton.disabled = false;
    } catch (err) {
      statusEl.textContent = "모델을 불러오는 데 실패했습니다: " + err.message;
      console.error(err);
    }
  }

  async function render() {
    const keyword = keywordInput.value.trim();
    if (!keyword) {
      resultDiv.innerHTML = '<p class="sub">키워드를 입력하세요.</p>';
      return;
    }
    runButton.disabled = true;
    resultDiv.innerHTML = '<p class="sub"><span class="spinner"></span>추천 계산 중...</p>';

    const lambda = Number(lambdaInput.value);
    const result = await rec.recommendByKeyword(keyword, 5, lambda);

    if (result.length === 0) {
      resultDiv.innerHTML = `<div class="card"><p class="sub">"${keyword}"와(과) 관련된 책을 찾지 못했어요. 다른 키워드로 시도해보세요.</p></div>`;
      document.querySelector("#compare-table tbody").innerHTML = "";
      runButton.disabled = false;
      return;
    }

    const books = rec.booksOf(result);
    const avgRel = rec.avgRelevance(result);
    const div = rec.diversityIndex(result);

    const itemsHtml = books
      .map(
        (b) => `
      <li>
        <details>
          <summary>${b.title} <span class="metrics">(${b.genre})</span></summary>
          <p class="description">${b.description}</p>
        </details>
      </li>`
      )
      .join("");

    resultDiv.innerHTML = `
      <div class="card">
        <h3>"${keyword}" · λ = ${lambda.toFixed(1)}</h3>
        <ol class="book-list">${itemsHtml}</ol>
        <div class="metrics">평균 관련성 = ${avgRel.toFixed(3)} · 다양성 지수 = ${div.toFixed(3)} (낮을수록 다양함)</div>
      </div>
    `;

    const tbody = document.querySelector("#compare-table tbody");
    tbody.innerHTML = "";
    for (const l of [1.0, 0.8, 0.6, 0.4, 0.2]) {
      const r = await rec.recommendByKeyword(keyword, 5, l);
      const row = document.createElement("tr");
      row.innerHTML = `<td>${l.toFixed(1)}</td><td>${rec.avgRelevance(r).toFixed(3)}</td><td>${rec.diversityIndex(r).toFixed(3)}</td>`;
      tbody.appendChild(row);
    }

    runButton.disabled = false;
  }

  runButton.addEventListener("click", render);
  init();
</script>
</body>
</html>
